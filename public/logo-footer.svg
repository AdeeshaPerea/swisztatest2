<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 56" width="360" height="56" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&amp;family=Outfit:wght@800&amp;display=swap');
      .footer-brand-light { fill: #FFFFFF; font-family: 'Outfit', 'Jost', 'Segoe UI', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 1.5px; }
      .footer-brand-red { fill: #EE1C25; font-family: 'Outfit', 'Jost', 'Segoe UI', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 1.5px; }
      .footer-tm { fill: #E0B45C; font-family: 'Jost', sans-serif; font-weight: 800; font-size: 11px; }
      .footer-sub { fill: #E0B45C; font-family: 'Jost', 'Segoe UI', sans-serif; font-weight: 700; font-size: 10.5px; letter-spacing: 2.8px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- 2x2 Icon Grid -->
  <g transform="translate(2, 6)">
    <rect x="0" y="0" width="19" height="19" rx="3.5" fill="#8C0E1E" />
    <rect x="22" y="0" width="19" height="19" rx="3.5" fill="#EE1C25" />
    <rect x="0" y="22" width="19" height="19" rx="3.5" fill="#FF4D30" />
    <rect x="22" y="22" width="19" height="19" rx="3.5" fill="#E5185D" />
  </g>

  <!-- Brand Typography -->
  <text x="54" y="32" class="footer-brand-light">SWIS</text>
  <text x="145" y="32" class="footer-brand-red">ZT</text>

  <!-- Stylized Chevron Apex 'A' -->
  <path d="M 197 32 L 209 8 L 221 32" stroke="#EE1C25" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="miter" fill="none" />

  <!-- TM Symbol -->
  <text x="226" y="14" class="footer-tm">TM</text>

  <!-- Subtitle -->
  <text x="54" y="48" class="footer-sub">HOTEL &amp; HOSPITALITY SERVICES</text>
</svg>
