<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <defs>
    <style>
      .brand-light { fill: #FFFFFF; font-family: 'Outfit', 'Jost', sans-serif; font-weight: 800; font-size: 54px; letter-spacing: 2px; }
      .brand-red { fill: #ED1C24; font-family: 'Outfit', 'Jost', sans-serif; font-weight: 800; font-size: 54px; letter-spacing: 2px; }
      .sub-title { fill: #E0B45C; font-family: 'Jost', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 6px; text-transform: uppercase; }
      .tag-line { fill: #94A3B8; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 13.5px; letter-spacing: 7px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- 2x2 Icon Grid -->
  <g transform="translate(10, 28)">
    <rect x="0" y="0" width="23" height="23" rx="5" fill="#D32F2F" />
    <rect x="27" y="0" width="23" height="23" rx="5" fill="#ED1C24" />
    <rect x="0" y="27" width="23" height="23" rx="5" fill="#FF5722" />
    <rect x="27" y="27" width="23" height="23" rx="5" fill="#E91E63" />
  </g>

  <!-- Brand Typography: SWIS (light) + Z (red) + T (light) + A (red chevron) -->
  <text x="75" y="70" class="brand-light">SWIS</text>
  <text x="228" y="70" class="brand-red">Z</text>
  <text x="268" y="70" class="brand-light">T</text>

  <!-- Stylized Chevron 'A' without crossbar -->
  <path d="M 310 68 L 328 34 L 346 68" stroke="#ED1C24" stroke-width="7.5" stroke-linecap="square" stroke-linejoin="miter" fill="none" />

  <!-- Subtitle: HOTEL SERVICES -->
  <text x="40" y="118" class="sub-title">HOTEL SERVICES</text>

  <!-- Tagline: CARE. COMFORT. EXCELLENCE. -->
  <text x="75" y="152" class="tag-line">CARE. COMFORT. EXCELLENCE.</text>
</svg>
